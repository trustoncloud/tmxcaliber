name: Pytest and release tag

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.11"

    - name: Install project and dev dependencies
      run: uv sync --frozen --extra dev

    - name: Ensure release version is incremented
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: uv run python .github/scripts/check_release_version.py
      continue-on-error: false

    - name: Run pytest test suite with coverage
      run: |
        uv run coverage run ./test/run_tests.py
        uv run coverage report -m
      continue-on-error: false

    - name: Run Ruff format check
      run: uv run ruff format --check .

    - name: Run Ruff lint
      run: uv run ruff check .

    - name: Run mypy
      run: uv run mypy

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && contains(github.ref, 'refs/heads/main')
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Extract version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Set up date for release
      id: date
      run: echo "RELEASE_DATE=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

    - name: Install GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gh

    - name: Authenticate GitHub CLI
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh auth setup-git

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ env.VERSION }}-${{ env.RELEASE_DATE }} --title "Release ${{ env.VERSION }}-${{ env.RELEASE_DATE }}" --notes "Release created automatically"
