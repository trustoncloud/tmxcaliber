name: Refresh the vendored API contract

# Daily, and on demand: fetch the API definition the production API serves and,
# when it says something the copy this package ships does not, release a patch
# version carrying it.
#
# The release happens the ordinary way. A GitHub App opens a pull request with
# the new contract and the version bump, the PR's own CI runs, this workflow
# waits for it, and squash-merges; the merge is a push to main, which runs
# release.yml and publishes to PyPI. Nothing here publishes.
#
# Three jobs, split by what each one holds:
#   fetch    the API key, and installs nothing
#   prepare  no secret at all, and is the one job that runs uv
#   propose  the App token, and installs nothing
#
# Setup that lives in no file (the App, its installation, the three secrets)
# and the reasoning behind each choice: specs, tmxcaliber/PROCESS.md, "The
# daily refresh".

on:
  schedule:
    # Off the hour, when scheduled runs are least likely to be delayed.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report whether the contract changed and build the patch, but open no PR"
        type: boolean
        default: false

# One run at a time, queued rather than cancelled: two runs would force-push
# the same branch over each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# GITHUB_TOKEN stays read-only in every job. The only write credential is the
# App token, minted in propose.
permissions:
  contents: read

env:
  API_ORIGIN: https://api.trustoncloud.com
  BRANCH: chore/refresh-api-contract
  SCRIPT: .github/scripts/refresh_api_contract.py

jobs:
  fetch:
    name: Fetch and compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      base: ${{ steps.compare.outputs.base }}

    steps:
    # Always main, whichever ref a manual run was started from: a release is
    # cut from main, so the comparison has to be against main's copy.
    - name: Checkout main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        persist-credentials: false

    - name: Fetch the published contract
      env:
        TOC_API_KEY: ${{ secrets.TOC_API_KEY }}
      run: |
        set -euo pipefail
        if [ -z "${TOC_API_KEY}" ]; then
          echo "::error::The TOC_API_KEY secret is not set."
          exit 1
        fi
        # The key travels on stdin rather than in curl's arguments, so it is
        # never in the process list. Only an answer the API gave is printed.
        status="$(printf 'Authorization: Bearer %s\n' "${TOC_API_KEY}" | curl \
          --silent --show-error --max-time 60 --retry 3 --retry-connrefused \
          --header @- --header 'Accept: application/json' \
          --output "${RUNNER_TEMP}/v1.json" --write-out '%{http_code}' \
          "${API_ORIGIN}/v1/apis/openapi.json")"
        if [ "${status}" != "200" ]; then
          case "${status}" in
            401) hint="The key is wrong, revoked or expired." ;;
            403) hint="The key's tenant has no IP policy in force, or the API does not yet serve the definition outside a tenant's ranges." ;;
            *)   hint="The API did not answer with the contract." ;;
          esac
          echo "::error::${API_ORIGIN}/v1/apis/openapi.json answered ${status}. ${hint}"
          head -c 500 "${RUNNER_TEMP}/v1.json" || true
          exit 1
        fi

    - name: Compare with the vendored copy
      id: compare
      run: |
        set -euo pipefail
        # A plain assignment, so a refusal of the body fails the step.
        changed="$(python3 "${SCRIPT}" compare "${RUNNER_TEMP}/v1.json")"
        echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
        echo "base=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
        if [ "${changed}" = "true" ]; then
          echo "The published contract differs from the vendored copy." >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "The vendored contract is current. Nothing to release." >> "${GITHUB_STEP_SUMMARY}"
        fi

    - name: Keep the fetched contract
      if: steps.compare.outputs.changed == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fetched-contract
        path: ${{ runner.temp }}/v1.json
        if-no-files-found: error

  prepare:
    name: Prepare the change
    runs-on: ubuntu-latest
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    timeout-minutes: 10
    # No secret is in scope: this is the job that runs uv, and so the one that
    # may execute third-party code.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
    # The commit fetch compared against, so the patch is built on exactly what
    # it was judged against even if main moves meanwhile.
    - name: Checkout the compared commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.fetch.outputs.base }}
        persist-credentials: false

    - name: Download the fetched contract
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: fetched-contract
        path: ${{ runner.temp }}/fetched

    - name: Apply the contract and bump the patch version
      id: bump
      run: |
        set -euo pipefail
        python3 "${SCRIPT}" apply "${RUNNER_TEMP}/fetched/v1.json"
        version="$(python3 "${SCRIPT}" bump)"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    # Pinned, because an unpinned uv is the newest release, and a newer uv
    # rewrites the lockfile's own `revision` along with the version line. That
    # puts a format change no person chose into a release, and churns the file
    # for anyone locking with an older uv. Move it deliberately, by hand.
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.12.7"
        python-version: "3.11"

    # The lockfile records the root package's own version, so the bump moves it,
    # and that one line is all the relock may change. A newer lockfile revision
    # or a dependency resolved again stops the run here instead of riding into
    # a release; the pin above prevents the first, and this catches the rest.
    - name: Move uv.lock with the version, and nothing else
      run: |
        set -euo pipefail
        cp uv.lock "${RUNNER_TEMP}/uv.lock.before"
        uv lock
        python3 "${SCRIPT}" check-lock "${RUNNER_TEMP}/uv.lock.before"

    - name: Bundle the change
      run: |
        set -euo pipefail
        git diff --binary > "${RUNNER_TEMP}/refresh.patch"
        {
          echo "Prepared tmxcaliber ${{ steps.bump.outputs.version }}:"
          echo '```'
          git diff --stat
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Keep the patch
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: refresh-patch
        path: ${{ runner.temp }}/refresh.patch
        if-no-files-found: error

  propose:
    name: Open, verify and merge the release PR
    runs-on: ubuntu-latest
    needs: [fetch, prepare]
    if: github.event_name == 'schedule' || !inputs.dry_run
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
    # Not GITHUB_TOKEN: a PR opened or merged with it starts no workflow, so
    # neither the PR's CI nor release.yml on main would run. The App's token
    # starts both. Narrowed to what this job does.
    - name: Mint the App token
      id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-checks: read
        permission-statuses: read

    - name: Checkout the compared commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.fetch.outputs.base }}
        token: ${{ steps.app.outputs.token }}

    - name: Download the patch
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: refresh-patch
        path: ${{ runner.temp }}/patch

    # Two reasons to stand back, both warnings rather than failures, since each
    # resolves itself or is already in a person's hands.
    - name: Check the branch and main are still the refresh's to act on
      id: guard
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        APP_SLUG: ${{ steps.app.outputs.app-slug }}
        BASE: ${{ needs.fetch.outputs.base }}
      run: |
        set -euo pipefail
        # A person who pushed a fix to the refresh's PR has taken it over: a
        # force-push would erase their work. The branch is the refresh's only
        # while it is one commit on top of main, authored and committed by the
        # App; an amended commit keeps its author but names who amended it.
        remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
        # What this check read is what the push is leased on, so a commit
        # pushed after it is refused rather than overwritten.
        echo "lease=${remote_head}" >> "${GITHUB_OUTPUT}"
        if [ -n "${remote_head}" ]; then
          who="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${remote_head}" \
            --jq '"\(.author.login // "")/\(.committer.login // "")"')"
          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${remote_head}" --jq .ahead_by)"
          if [ "${who}" != "${APP_SLUG}[bot]/${APP_SLUG}[bot]" ] || [ "${ahead}" != "1" ]; then
            echo "::warning::${BRANCH} carries work that is not the refresh's own, so it and its PR are left to a person."
            echo "${BRANCH} has been taken over by a person; nothing was pushed or merged." >> "${GITHUB_STEP_SUMMARY}"
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
        fi
        # The patch and its version were built on BASE. If main has moved, the
        # version may already be released, and merging would publish nothing.
        main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
        if [ "${main}" != "${BASE}" ]; then
          echo "::warning::main moved since the fetch, so the patch is stale. The next run rebuilds on it."
          echo "main moved since the fetch; nothing was pushed or merged." >> "${GITHUB_STEP_SUMMARY}"
          echo "proceed=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        echo "proceed=true" >> "${GITHUB_OUTPUT}"

    - name: Commit as the App and open the PR
      id: pr
      if: steps.guard.outputs.proceed == 'true'
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        APP_SLUG: ${{ steps.app.outputs.app-slug }}
        VERSION: ${{ needs.prepare.outputs.version }}
        LEASE: ${{ steps.guard.outputs.lease }}
      run: |
        set -euo pipefail
        # Authored as the App's own bot account. The protect-main ruleset holds
        # a commit no GitHub account is attributed to for an approving review,
        # which would stall the merge below. It is also what the guard above
        # reads to tell the refresh's branch from one a person has taken over.
        bot="${APP_SLUG}[bot]"
        bot_id="$(gh api "users/${bot}" --jq .id)"
        git config user.name "${bot}"
        git config user.email "${bot_id}+${bot}@users.noreply.github.com"

        git apply --index "${RUNNER_TEMP}/patch/refresh.patch"
        title="chore: refresh the vendored API contract (${VERSION})"
        git commit --quiet --message "${title}"
        # Leased on the head the guard examined, or on the branch not existing
        # when it found none (an empty expected value). Anything pushed since
        # makes the push fail rather than disappear.
        git push --force-with-lease="refs/heads/${BRANCH}:${LEASE}" \
          origin "HEAD:refs/heads/${BRANCH}"
        echo "head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

        body="The API's published definition differs from the copy tmxcaliber ships. This updates the vendored contract and bumps the version to ${VERSION}. Merging releases it.

        Opened by [the daily refresh](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), which merges it once CI passes."
        pr="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
        if [ -z "${pr}" ]; then
          gh pr create --base main --head "${BRANCH}" --title "${title}" --body "${body}" >/dev/null
          pr="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number')"
        else
          gh pr edit "${pr}" --title "${title}" --body "${body}" >/dev/null
        fi
        echo "number=${pr}" >> "${GITHUB_OUTPUT}"
        echo "Opened ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${pr} for ${VERSION}." >> "${GITHUB_STEP_SUMMARY}"

    - name: Wait for CI
      if: steps.guard.outputs.proceed == 'true'
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        PR: ${{ steps.pr.outputs.number }}
      run: |
        set -euo pipefail
        # The ruleset requires no status checks, so nothing but this step stops
        # a merge before CI has run. The two jobs are named, so a PR on which CI
        # never started cannot pass: if release.yml renames them, this times
        # out rather than merging untested.
        deadline=$((SECONDS + 45 * 60))
        while :; do
          checks="$(gh pr checks "${PR}" --json name,bucket \
            --jq '.[] | "\(.name)=\(.bucket)"' 2>/dev/null || true)"
          if grep -qE '=(fail|cancel)$' <<<"${checks}"; then
            echo "::error::CI failed on #${PR}. The PR is left open for a person."
            echo "${checks}"
            exit 1
          fi
          if grep -qxF 'Run Pytest=pass' <<<"${checks}" \
            && grep -qxF 'Build distributions=pass' <<<"${checks}" \
            && ! grep -qE '=pending$' <<<"${checks}"; then
            echo "${checks}"
            break
          fi
          if [ "${SECONDS}" -ge "${deadline}" ]; then
            echo "::error::CI did not finish on #${PR} within 45 minutes."
            echo "${checks}"
            exit 1
          fi
          sleep 30
        done

    # Pinned to the commit CI just passed, so a push to the branch in between
    # cannot be merged untested. main is checked again because CI can take long
    # enough for a person to release in the meantime; what remains is the
    # seconds between that check and the merge. The merge is a push to main by
    # the App, which runs release.yml.
    - name: Merge, which releases
      if: steps.guard.outputs.proceed == 'true'
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        PR: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ steps.pr.outputs.head }}
        BASE: ${{ needs.fetch.outputs.base }}
        VERSION: ${{ needs.prepare.outputs.version }}
      run: |
        set -euo pipefail
        main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
        if [ "${main}" != "${BASE}" ]; then
          echo "::warning::main moved while CI ran, so #${PR} was not merged. The next run rebuilds on it."
          echo "main moved while CI ran; #${PR} was left open." >> "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        gh pr merge "${PR}" --squash --match-head-commit "${HEAD_SHA}"
        echo "Merged #${PR}; release.yml publishes ${VERSION}." >> "${GITHUB_STEP_SUMMARY}"
